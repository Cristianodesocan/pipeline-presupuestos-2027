    presupuestos: [2015, 2015]
    presidencia: Paulino Rivero
    coalicion: CC-PSOE
    base_comparacion: null
  - id: clavijo_i
    presupuestos: [2016, 2019]
    presidencia: Fernando Clavijo
    coalicion: "CC-PSOE (hasta dic. 2016); después CC en minoría"
    base_comparacion: 2015
  - id: torres
    presupuestos: [2020, 2023]
    presidencia: Ángel Víctor Torres
    coalicion: PSOE-NC-Podemos-ASG
    base_comparacion: 2019
  - id: clavijo_ii
    presupuestos: [2024, 2027]
    presidencia: Fernando Clavijo
    coalicion: CC-PP
